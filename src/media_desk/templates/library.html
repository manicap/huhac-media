{% extends "base.html" %}
{% block title %}Knihovna{% endblock %}
{% block content %}
<section class="library-heading">
  <div><h1>Knihovna</h1><p class="workspace-meta" title="{{ workspace.workspace_id }}">{{ workspace.workspace_id }}</p></div>
</section>
<form class="library-filters" id="library-filters" action="/library" method="get">
  <label class="search">Hledat<input name="q" value="{{ query }}" placeholder="Název zdroje nebo asset ID"></label>
  <label>Typ<select name="media_type"><option value="all" {% if media_type == 'all' %}selected{% endif %}>Vše</option><option value="image" {% if media_type == 'image' %}selected{% endif %}>Obrázky</option><option value="video" {% if media_type == 'video' %}selected{% endif %}>Video</option></select></label>
  <label>Řazení<select name="sort"><option value="captured_desc" {% if sort == 'captured_desc' %}selected{% endif %}>Nejnovější</option><option value="captured_asc" {% if sort == 'captured_asc' %}selected{% endif %}>Nejstarší</option></select></label>
  <fieldset class="density-control"><legend>Velikost</legend><div class="density-options">
    <label class="density-small" title="Malé náhledy"><input type="radio" name="density" value="small"><span class="density-icon" aria-hidden="true"></span><span class="sr-only">Malé</span></label>
    <label class="density-medium" title="Střední náhledy"><input type="radio" name="density" value="medium" checked><span class="density-icon" aria-hidden="true"></span><span class="sr-only">Střední</span></label>
    <label class="density-large" title="Velké náhledy"><input type="radio" name="density" value="large"><span class="density-icon" aria-hidden="true"></span><span class="sr-only">Velké</span></label>
  </div></fieldset>
  {% if date_from %}<input type="hidden" name="date_from" value="{{ date_from }}">{% endif %}{% if date_to %}<input type="hidden" name="date_to" value="{{ date_to }}">{% endif %}
  <button type="submit">Filtrovat</button>
</form>
<div id="library-app" data-snapshot-id="{{ snapshot_id }}" data-workspace-id="{{ workspace.workspace_id }}" data-active-asset-id="{{ active_asset_id or '' }}" data-batch-size="50">
  <div class="library-meta-row">
    <div class="library-status" aria-live="polite"><span id="library-count">Načítání indexu…</span><span id="library-period"></span></div>
    <nav id="time-navigator" class="time-navigator" aria-label="Časový navigátor knihovny"></nav>
    <label class="time-select-label" for="time-select">Přejít na období</label><select id="time-select" class="time-select"><option value="">Vyberte období…</option></select>
  </div>
  <div id="snapshot-notice" class="notice" hidden>Data byla aktualizována. <button type="button">Obnovit pohled</button></div>
  <div id="library-error" class="notice error-notice" role="alert" hidden><span>Část galerie se nepodařilo načíst.</span><button type="button" id="library-retry">Zkusit znovu</button><button type="button" id="library-load-more">Načíst další</button></div>
  <div id="library-viewport" class="library-viewport" tabindex="0" aria-label="Virtualizovaná galerie médií"><div id="library-canvas" class="library-canvas"><div id="library-window" class="library-window" aria-live="polite"></div></div></div>
  <noscript><p class="notice">Pro plynulé dávkové načítání knihovny je potřeba JavaScript.</p></noscript>
</div>
<script type="module" src="/static/library.js?v=1.3.0"></script>
{% endblock %}
